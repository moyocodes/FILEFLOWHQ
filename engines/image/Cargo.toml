# FileFlowHQ image engine: photocraft's own codecs and file readers (HEIC, camera RAW, PSD,
# TIFF, EXR, AVIF, …) compiled to WebAssembly for the converter tools (no editor UI). Source:
# photocraft v0.8.2 at ~/Developer/craft-apps/engine-src/photocraft-v0.8.2. Build: ../build.sh image
[package]
name = "ffhq-image-engine"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
photocraft-io = { path = "../../../craft-apps/engine-src/photocraft-v0.8.2/crates/io", features = ["heif"] }
wasm-bindgen = "=0.2.129"

# Small where code runs once per file, fast where it touches every pixel (as photocraft's own
# wasm-release profile).
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
[profile.release.package."*"]
opt-level = "s"
[profile.release.package.photocraft-raster]
opt-level = 3
[profile.release.package.photocraft-color]
opt-level = 3
[profile.release.package.photocraft-cms]
opt-level = 3
[profile.release.package.photocraft-compose]
opt-level = 3

[workspace]
