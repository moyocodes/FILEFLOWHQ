# FileFlowHQ Word engine: wordcraft's own document reader, page layout and writers, compiled
# to WebAssembly for the converter tools (no editor UI). Source: wordcraft v0.6.1, checked out
# at ~/Developer/craft-apps/engine-src/wordcraft-v0.6.1. Build: ../build.sh word
[package]
name = "ffhq-word-engine"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wordcraft-engine = { path = "../../../craft-apps/engine-src/wordcraft-v0.6.1/crates/engine" }
wasm-bindgen = "=0.2.129"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"

[workspace]
