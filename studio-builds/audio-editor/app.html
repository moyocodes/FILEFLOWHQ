<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Audio Studio — FileFlowHQ</title>
  <link rel="icon" href="./ai.storyteller.soundcraft-d22f90cb7f0819ea.png" integrity="sha384-LvqCN4dQ6vOXATN8cndedzQbziSrWy4sFDrUAnGgImIiTkS6ffRg2xHX9Z3pQnig"/>
  
<script type="module">
import init, * as bindings from './soundcraft-web-2f2931e32cff6262.js';
const wasm = await init({ module_or_path: './soundcraft-web-2f2931e32cff6262_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    /* Transparent until the app paints: the embedding page shows its own loader behind it. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #soundcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #soundcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
<link rel="modulepreload" href="./soundcraft-web-2f2931e32cff6262.js" crossorigin="anonymous" integrity="sha384-1bKk/Vu51E+ccA0jowHBXXHSzeBa5SCJRELfB0VvVB4Ee4d/Y8jVx49Nqwx1tb+s"><link rel="preload" href="./soundcraft-web-2f2931e32cff6262_bg.wasm" crossorigin="anonymous" integrity="sha384-cIBG6Tfv2y0V8xw8b8sijkMYUaNZ2ztCdgFMBZj8+ji6DOJXATa99jsgbXw70jwg" as="fetch" type="application/wasm"></head>
<body>
  <canvas id="soundcraft_canvas"></canvas>
  <script>
    // cpal (wasm) builds the output stream at startup, before any user gesture, so the
    // WebAudio AudioContext stays 'suspended': no audio is heard and the transport clock
    // (driven by the audio callback) never advances. Capture the AudioContext cpal creates
    // and resume it on the first user gesture. Runs before the wasm module is instantiated.
    (function () {
      var Orig = window.AudioContext || window.webkitAudioContext;
      if (!Orig) return;
      var ctxs = [];
      function Wrapped(opts) { var c = new Orig(opts); ctxs.push(c); return c; }
      Wrapped.prototype = Orig.prototype;
      window.AudioContext = Wrapped;
      if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
      function resumeAll() {
        ctxs.forEach(function (c) { if (c.state === 'suspended') { c.resume().catch(function () {}); } });
      }
      ['pointerdown', 'mousedown', 'touchstart', 'keydown'].forEach(function (ev) {
        window.addEventListener(ev, resumeAll, { capture: true });
      });
    })();
  </script>
  <div id="soundcraft_loading">Loading Audio Studio&hellip;</div>
</body>
</html>
